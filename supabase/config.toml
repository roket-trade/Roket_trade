project_id = "pnzspoelivyihngacssv"

# The 30-second pg_cron poller authenticates with a shared secret
# (VERIFY_DEPOSIT_SECRET), not a user JWT, so the gateway must not require one.
# The function still rejects unauthorized callers itself.
[functions.verify-crypto-deposit]
verify_jwt = false

# send-email authorises every call itself: service-role key (other Edge
# Functions) or a signed-in admin's access token. The gateway check is disabled
# because newer Supabase secret keys are opaque strings, not bearer JWTs.
[functions.send-email]
verify_jwt = false
